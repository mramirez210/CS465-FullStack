<section class="login-page" aria-labelledby="login-heading">
  <div class="form-heading">
    <div>
      <p class="section-label">Secure administration</p>
      <h1 id="login-heading">Administrator Login</h1>
      <p>Sign in to add, edit, or delete Travlr trip packages.</p>
    </div>
    <a class="btn btn-outline-secondary" routerLink="/">View Trips</a>
  </div>

  <div *ngIf="statusMessage" class="alert alert-info" role="status">{{ statusMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input
        id="email"
        class="form-control"
        type="email"
        formControlName="email"
        autocomplete="username"
        [class.is-invalid]="submitted && f.email.invalid"
      >
      <div class="invalid-feedback">Enter a valid administrator email address.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input
        id="password"
        class="form-control"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.is-invalid]="submitted && f.password.invalid"
      >
      <div class="invalid-feedback">Password is required.</div>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="authenticating">
      {{ authenticating ? 'Signing In...' : 'Sign In' }}
    </button>
  </form>
</section>
