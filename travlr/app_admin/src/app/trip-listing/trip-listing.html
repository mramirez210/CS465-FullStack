<div class="d-flex justify-content-between align-items-center mb-3">
	<h2 class="mb-0">Trips</h2>
	<button class="btn btn-primary" type="button" (click)="addTrip()">Add Trip</button>
</div>

<p class="text-muted">{{ message }}</p>
<p class="text-danger" *ngIf="errorDetail">{{ errorDetail }}</p>
<div class="spinner-border text-secondary" role="status" *ngIf="isLoading">
	<span class="visually-hidden">Loading...</span>
</div>

<div class="row g-3">
	<div class="col-12 col-md-4" *ngFor="let trip of trips">
		<app-trip-card [trip]="trip"></app-trip-card>
	</div>
</div>
