<div class="card h-100">
	<img class="card-img-top" [src]="imagePath(trip.image)" [alt]="trip.name">
	<div class="card-body d-flex flex-column">
		<h5 class="card-title">{{ trip.name }}</h5>
		<h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
		<p class="card-text mb-1">{{ trip.length }}</p>
		<p class="card-text fw-semibold">{{ priceValue(trip.perPerson) | currency:'USD':'symbol' }} per person</p>
		<p class="card-text small">{{ trip.description }}</p>
		<div class="mt-auto d-flex gap-2">
			<button class="btn btn-sm btn-outline-primary" type="button" (click)="editTrip(trip)">Edit Trip</button>
			<button class="btn btn-sm btn-outline-danger" type="button" (click)="deleteTrip(trip)">Delete Trip</button>
		</div>
	</div>
</div>
